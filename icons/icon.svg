<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background circle -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a73e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="60" fill="url(#bg-gradient)"/>

  <!-- Globe -->
  <g stroke="white" stroke-width="3" fill="none">
    <!-- Main circle -->
    <circle cx="64" cy="56" r="32"/>

    <!-- Latitude lines -->
    <ellipse cx="64" cy="56" rx="32" ry="10"/>

    <!-- Longitude line -->
    <line x1="64" y1="24" x2="64" y2="88"/>

    <!-- Horizontal line -->
    <line x1="32" y1="56" x2="96" y2="56"/>
  </g>

  <!-- Flag pole -->
  <line x1="80" y1="64" x2="80" y2="96" stroke="white" stroke-width="3"/>

  <!-- Flag -->
  <path d="M 80,64 L 100,68 L 100,80 L 80,76 Z" fill="#ff4444"/>
</svg>